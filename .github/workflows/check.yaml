name: Check
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mayu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mayu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22.2"
      - run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - run: shards install
      - run: crystal tool format --check src spec
      - run: shards build
      - run: test/start_tls_postgres.sh "$RUNNER_TEMP/tls"
      - run: crystal spec
        env:
          MAYU_TEST_DATABASE_URL: postgres://postgres@localhost:5432/mayu_test
          MAYU_TEST_TLS_DATABASE_URL: postgres://postgres@localhost:5433/mayu_test?sslrootcert=${{ runner.temp }}/tls/ca.crt
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mayu:check .
      - run: docker run -d --name mayu-check -p 127.0.0.1:3000:3000 mayu:check
      - run: python3 test/http_smoke.py http://localhost:3000
      - run: test "$(docker exec mayu-check id -u)" = 1000
      - if: failure()
        run: docker logs mayu-check
      - if: always()
        run: docker rm -f mayu-check
